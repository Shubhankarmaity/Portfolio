<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Stand -->
  <path d="M 210 430 L 190 480 H 322 L 302 430 Z" fill="#475569" stroke="#1e293b" stroke-width="14" stroke-linejoin="round" />
  <path d="M 170 480 H 342" stroke="#1e293b" stroke-width="14" stroke-linecap="round" />

  <!-- Connector Lines -->
  <!-- Node 1 (Far Left Yellow) -->
  <path d="M 160 210 V 150 H 100" fill="none" stroke="#1e293b" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Node 2 (Top Left Red) -->
  <path d="M 200 210 V 100 H 170" fill="none" stroke="#1e293b" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Node 3 (Center Top Green) -->
  <path d="M 256 210 V 75" fill="none" stroke="#1e293b" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Node 4 (Top Right Red) -->
  <path d="M 312 210 V 100 H 342" fill="none" stroke="#1e293b" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Node 5 (Far Right Yellow) -->
  <path d="M 352 210 V 150 H 412" fill="none" stroke="#1e293b" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Node Circles -->
  <!-- Far Left Yellow -->
  <circle cx="80" cy="150" r="24" fill="#fbbf24" stroke="#1e293b" stroke-width="14" />
  <!-- Top Left Red -->
  <circle cx="150" cy="90" r="24" fill="#f87171" stroke="#1e293b" stroke-width="14" />
  <!-- Center Top Green -->
  <circle cx="256" cy="55" r="24" fill="#a3e635" stroke="#1e293b" stroke-width="14" />
  <!-- Top Right Red -->
  <circle cx="362" cy="90" r="24" fill="#f87171" stroke="#1e293b" stroke-width="14" />
  <!-- Far Right Yellow -->
  <circle cx="432" cy="150" r="24" fill="#fbbf24" stroke="#1e293b" stroke-width="14" />

  <!-- Monitor Body -->
  <rect x="76" y="195" width="360" height="235" rx="28" fill="#ffffff" stroke="#1e293b" stroke-width="14" />
  <!-- Monitor Display Screen -->
  <path d="M 90 210 H 422 V 380 H 90 Z" fill="#93c5fd" />
  <!-- Screen Shadow / Reflection curve -->
  <path d="M 90 310 Q 256 370 422 310 V 380 H 90 Z" fill="#60a5fa" />
  <line x1="76" y1="390" x2="436" y2="390" stroke="#1e293b" stroke-width="14" />

  <!-- Gear Wheel -->
  <g transform="translate(256, 235)">
    <!-- Gear outer body with teeth -->
    <path d="
      M -20 -70 L -12 -86 H 12 L 20 -70 
      L 46 -60 L 60 -74 L 74 -60 L 60 -46 
      L 70 -20 L 86 -12 V 12 L 70 20 
      L 60 46 L 74 60 L 60 74 L 46 60 
      L 20 70 L 12 86 H -12 L -20 70 
      L -46 60 L -60 74 L -74 60 L -60 46 
      L -70 20 L -86 12 V -12 L -70 -20 
      L -60 -46 L -74 -60 L -60 -74 L -46 -60 Z
    " fill="#475569" stroke="#1e293b" stroke-width="14" stroke-linejoin="round" />
    <!-- Gear Inner Center Hole -->
    <circle cx="0" cy="0" r="32" fill="#ffffff" stroke="#1e293b" stroke-width="14" />
  </g>
</svg>
